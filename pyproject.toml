[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antidote-tox-poisoning-engine"
version = "2.0.0"
description = "ToxAntidote Sentinel: Emergency Toxicology Toxidrome & Antidote Dosing Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
antidote-tox-poisoning-engine = "antidote_tox_poisoning_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/antidote-tox-poisoning-engine"
Repository = "https://github.com/abusuraihsakhri/antidote-tox-poisoning-engine.git"
